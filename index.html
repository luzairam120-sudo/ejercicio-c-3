<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light p-3">
    <div class="container bg-white shadow rounded p-4 my-4">
        <h1 class="display-5 fw-bold text-center text-uppercase">
            Menú Gourmet
        </h1>
        <hr>
        <ul class="list-inline text-uppercase fw-bold text-primary
                   text-center">
            <li class="list-inline-item me-3">Entradas</li>
            <li class="list-inline-item me-3">Platos fuertes</li>
            <li class="list-inline-item me-3">Postres</li>
            <li class="list-inline-item">Bebidas</li>
        </ul>

        <h2 class="h3 fw-bold mt-4 mb-3 text-center">Platos principales</h2>

        <ul class="list-unstyled">
            <li class="mb-4">
                <p class="h4 fw-bold">
                    1. Lomo Salteado Gourmet
                    <span class="text-success float-end">$18.50</span>
                </p>
                <p class="fst-italic text-muted">
                    Trozos de lomo de res, cebolla morada, tomate y papas nativas.
                </p>
            </li>

            <li class="mb-4">
                <p class="h4 fw-bold">
                    2. Risotto de Champiñones
                    <span class="text-success float-end">$16.00</span>
                </p>
                <p class="fst-italic text-muted">
                    Arroz arborio, setas silvestres y queso parmesano madurado.
                </p>
            </li>
        </ul>

    </div>

</body>
</html>
